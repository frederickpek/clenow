[project]
name = "clenow"
version = "0.1.0"
description = "Jupyter notebooks for Clenow-style S&P 500 momentum ranking and ATR-based position sizing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "lxml>=5.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scipy>=1.12",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clenow"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
